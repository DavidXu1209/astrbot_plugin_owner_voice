name: astrbot_plugin_owner_voice
display_name: 按需语音（主人私聊）
desc: |
  只有指定的主人本人在私聊里明确要求时，才把这次回复念成中文女声语音发出来；
  配置了 BreezeBlue 音色就用它，没配则用免 Key 的微软 edge-tts 声音。
  明确要过语音后的几分钟都会念；平时主动关心有小概率用语音，晚上 10 点后略高一点。
  深夜主人道晚安时，还会按概率主动回一条晚安语音（每 7 天有上限）。
version: 0.2.10
author: David Xu
repo: https://github.com/DavidXu1209/astrbot_plugin_owner_voice
astrbot_version: ">=4.16.0"
support_platforms:
  - aiocqhttp
tags:
  - 语音
  - TTS
  - 私聊
  - 按需语音
